<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股趨勢選股</title>
<style>
  /* 配色：#7F9AC8 主藍、#AEBAD4 淡藍紫、#C4C8D7 灰紫、#D9DBDA 淺灰、#E7D2C6 奶茶 */
  :root { --bg:#ECEEF2; --card:#FFFFFF; --ink:#2B3550; --mute:#6F7894; --line:#C4C8D7;
          --head:#4D72AE; --accent:#7F9AC8; --chip:#E4E8F1; --chip-ink:#4D5E85;
          --up:#C25B5B; --up-bg:#F6E3E1; --down:#3E8B6B; --down-bg:#DDEFE6;
          --warn:#9A6A4F; --warn-bg:#E7D2C6; --no-bg:#ECEEF2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1A1E29; --card:#232836; --ink:#E3E7F0; --mute:#9AA3BC; --line:#363D52;
            --head:#AEBAD4; --accent:#7F9AC8; --chip:#2D3446; --chip-ink:#C4C8D7;
            --up:#EE9A94; --up-bg:#3D2A30; --down:#8FD1B3; --down-bg:#23382F;
            --warn:#E7D2C6; --warn-bg:#43383A; --no-bg:#2A3040; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  .wrap { max-width:960px; margin:auto; padding:0 16px; }
  header { padding-top:20px; }
  h1 { font-size:22px; margin:0 0 4px; color:var(--head); letter-spacing:.5px; }
  .meta { color:var(--mute); font-size:13px; }
  .mkt { margin:12px 0 4px; background:var(--card); border:1px solid var(--line); border-radius:14px;
         padding:12px 14px; display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; }
  .mkt b { font-size:18px; color:var(--head); }
  .mkt .cap { font-weight:600; }
  nav { display:flex; gap:6px; padding:10px 0; overflow-x:auto; }
  nav button { border:1px solid transparent; background:var(--chip); color:var(--chip-ink);
               padding:8px 14px; border-radius:999px; font-size:14px; white-space:nowrap; cursor:pointer; }
  nav button.on { background:var(--accent); color:#fff; font-weight:600; }
  .list { display:grid; gap:10px; padding-bottom:28px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
          box-shadow:0 2px 10px rgba(77,114,174,.08); }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .code { font-weight:700; font-size:16px; }
  .name { color:var(--mute); font-size:13px; }
  .score { font-variant-numeric:tabular-nums; color:var(--head); font-weight:700; }
  .title { font-weight:600; }
  .small { color:var(--mute); font-size:12.5px; }
  .nums { font-variant-numeric:tabular-nums; margin:6px 0 2px; }
  .nums b { color:var(--head); }
  .checks { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
  .chk { font-size:12px; padding:2px 8px; border-radius:8px; background:var(--chip); color:var(--chip-ink); }
  .chk.bad { background:var(--warn-bg); color:var(--warn); }
  .tag { display:inline-block; white-space:nowrap; font-size:12px; padding:2px 9px; border-radius:999px; font-weight:600; }
  .long { color:var(--up); background:var(--up-bg); }
  .short { color:var(--down); background:var(--down-bg); }
  .back { color:var(--warn); background:var(--warn-bg); }
  .no { color:var(--mute); background:var(--no-bg); font-weight:500; }
  .why { margin-top:6px; color:var(--warn); font-size:12.5px; }
  .live { margin-top:8px; font-size:13px; }
  .empty { padding:24px; text-align:center; color:var(--mute); background:var(--card); border-radius:14px; border:1px solid var(--line); }
  footer { color:var(--mute); font-size:12px; padding-bottom:32px; }
</style>
</head>
<body>
<header class="wrap">
  <h1>台股趨勢選股</h1>
  <div class="meta" id="meta">載入中…</div>
  <div class="mkt" id="mkt" hidden></div>
</header>
<nav class="wrap" id="tabs"></nav>
<main class="wrap"><div class="list" id="list"></div></main>
<footer class="wrap">
  「收盤要 ≥ / ≤」是明天收盤需要到的價位，另外還要是漲跌 2% 以上的實體 K 棒；做多量要大於昨天 1.3 倍，做空有量無量都可以。KD 只當參考。
  鎖股名單是當天漲跌 3.5% 以上、趨勢方向一致的股票，先鎖定觀察，等出現進場位置再動作。
  盤中狀態依最近一次檢查（10:55 預警／13:00 確認），仍以 13:30 收盤為準。僅供參考，不構成投資建議。
</footer>
<script>
const fmt = n => (n == null ? "–" : Number(n).toLocaleString("zh-TW", {maximumFractionDigits: 2}));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cand, checks, cur;
try { cur = localStorage.getItem("tab2"); } catch (e) {}

async function load(name) {
  const r = await fetch(name + "?t=" + Date.now());
  if (!r.ok) throw new Error(name);
  return r.json();
}

function liveMap() {
  const runs = (checks && checks.for_data_date === cand.data_date) ? checks.runs : [];
  if (!runs.length) return { run: null, map: {} };
  const run = runs[runs.length - 1], map = {};
  (run.results || []).forEach(x => map[x.code + x.side] = x);
  return { run, map };
}

function tabs() {
  const m = cand.market || {};
  const t = [
    ["long", "多方預備" + (m.allow_long === false ? "・逆大盤" : ""), cand.long],
    ["short", "空方預備" + (m.allow_short === false ? "・逆大盤" : ""), cand.short],
    ["confirmed", "今日已確認", cand.confirmed],
    ["watch", "鎖股名單", cand.watch || []],
    ["excluded", "被排除", cand.excluded],
  ];
  if (!t.some(x => x[0] === cur)) cur = m.allow_short && !m.allow_long ? "short" : "long";
  return t;
}

function watchCard(r) {
  const up = r.chg > 0;
  const mk = r.market === "otc" ? "上櫃" : "上市";
  return `<div class="card">
    <div class="row"><div><span class="tag ${up ? "long" : "short"}">${up ? "強" : "弱"}</span>
      <span class="code">${esc(r.code)}</span> <span class="name">${esc(r.name)}・${mk}</span></div>
      <div class="score">${up ? "+" : ""}${r.chg}%</div></div>
    <div class="row"><span class="title">收 ${fmt(r.close)}・${esc(r.trend)}</span><span class="small">${esc(r.sector || "")}${r.rs != null ? "・強度 " + r.rs : ""}</span></div>
    <div class="checks">
      <span class="chk">均線：${esc(r.ma)}</span><span class="chk">位階：${esc(r.pos)}</span>
      <span class="chk">成交量：${esc(r.vol)}</span>${r.chips ? `<span class="chk">籌碼：${esc(r.chips)}</span>` : ""}
    </div>
  </div>`;
}

function card(r, mode, live) {
  const side = r.side === "long";
  const sideTag = `<span class="tag ${side ? "long" : "short"}">${side ? "多" : "空"}</span>`;
  const mk = r.market === "otc" ? "上櫃" : "上市";
  let nums;
  if (mode === "confirmed") {
    nums = `收盤 <b>${fmt(r.close)}</b>（${r.chg_pct > 0 ? "+" : ""}${r.chg_pct}%）・停損 ${fmt(r.stop.use || r.stop.fixed)}`
         + (r.stop.method ? `（${esc(r.stop.method)}）` : "") + `・K線停損 ${fmt(r.stop.kline)}`;
  } else {
    nums = `收 ${fmt(r.close)} → 收盤要 ${side ? "≥" : "≤"} <b>${fmt(r.trigger)}</b>（${r.gap_pct.toFixed(1)}%）`
         + (r.need_vol ? `・量 ≥ ${fmt(Math.round((r.vol_ref || r.vol5) * r.need_vol))} 張（${r.vol_ref ? "昨量" : "均量"} ${r.need_vol} 倍）` : "")
         + `<br>停損 ${fmt(r.stop.use || r.stop.fixed)}` + (r.stop.method ? `（${esc(r.stop.method)}）` : "")
         + (r.term ? `・${esc(r.term)}` : "");
  }
  const chks = (r.checks || []).filter(c => !(mode === "excluded" && c.step === "排除條件")).map(c =>
    `<span class="chk ${c.ok ? "" : "bad"}">${c.ok ? "✓" : "✗"} ${esc(c.step)}：${esc(c.text)}</span>`).join("");
  let lv = "";
  const s = live && live[r.code + r.side];
  if (s && mode !== "excluded") {
    const cls = s.status === "成形" ? (side ? "long" : "short") : s.status === "未到" ? "no" : "back";
    lv = `<div class="live"><span class="tag ${cls}">${esc(s.status)}</span> 現 ${fmt(s.price)}`
       + (s.miss && s.miss.length ? `<span class="small">｜${esc(s.miss.join("、"))}</span>` : "")
       + (s.note ? `<span class="small">｜參考：${esc(s.note)}</span>` : "") + `</div>`;
  }
  const why = mode === "excluded" && r.why ? `<div class="why">✗ ${esc(r.why.join("；"))}</div>` : "";
  return `<div class="card">
    <div class="row"><div>${sideTag} <span class="code">${esc(r.code)}</span> <span class="name">${esc(r.name)}・${mk}</span></div>
      <div class="score">${r.score} 分</div></div>
    <div class="row"><span class="title">${esc(r.title)}</span><span class="small">${esc(r.position)}・${esc(r.trend)}${r.sector ? "・" + esc(r.sector) : ""}${r.rs != null ? "・強度 " + r.rs : ""}</span></div>
    <div class="small">${esc(r.note)}</div>
    <div class="nums">${nums}</div>
    ${why}${lv}
    <div class="checks">${chks}</div>
  </div>`;
}

function render() {
  const t = tabs();
  document.getElementById("tabs").innerHTML = t.map(([k, label, arr]) =>
    `<button class="${k === cur ? "on" : ""}" data-k="${k}">${label}（${arr.length}）</button>`).join("");
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
    cur = b.dataset.k; try { localStorage.setItem("tab2", cur); } catch (e) {} render();
  });
  const items = t.find(x => x[0] === cur)[2];
  const { run, map } = liveMap();
  const head = run && (cur === "long" || cur === "short")
    ? `<div class="small">盤中 ${run.time} ${run.slot || ""}結果已標在每檔上</div>` : "";
  document.getElementById("list").innerHTML = items.length
    ? head + items.map(r => cur === "watch" ? watchCard(r) : card(r, cur, map)).join("")
    : '<div class="empty">今天沒有符合的股票</div>';
}

(async () => {
  try {
    cand = await load("candidates.json");
    if (!cand.version) throw new Error("old");
    try { checks = await load("checks.json"); } catch (e) { checks = null; }
    document.getElementById("meta").textContent = `${cand.data_date} 收盤資料・產生於 ${cand.generated_at}`;
    const m = cand.market;
    if (m) {
      const el = document.getElementById("mkt");
      el.hidden = false;
      const push = m.allow_long && m.allow_short ? "多空都推" : m.allow_long ? "只推多方" : "只推空方";
      el.innerHTML = `<span>加權 <b>${fmt(m.close)}</b> ${m.chg_pct > 0 ? "+" : ""}${m.chg_pct}%</span>
        <span>${esc(m.label)}</span><span>月線 ${fmt(m.ma20)} ${esc(m.ma20_dir)}</span>
        <span class="cap">建議資金 ${esc(m.capital)}</span><span class="small">${push}</span>`;
    }
    render();
  } catch (e) {
    document.getElementById("meta").textContent = "還沒有新版資料，等今晚掃描完成後就會出現。";
  }
})();
</script>
</body>
</html>
