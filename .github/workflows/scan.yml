name: 晚上選股掃描

on:
  schedule:
    - cron: "17 12 * * 1-5"   # 台灣時間 週一到五 20:17（GitHub 用 UTC，所以寫 12）
    workflow_dispatch:
      inputs:
        force:
          description: "同一天重跑也推播"
          default: "true"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    timeout-minutes: 90        # 第一次回補歷史資料約 20–40 分鐘
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 掃描並推播
        env:
          HOLDINGS_URL: ${{ secrets.HOLDINGS_URL }}
          HOLDINGS_SECRET: ${{ secrets.HOLDINGS_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python scan.py           run: python scan.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force == 'true') && '--force' || '' }}
      - name: 存檔
        if: always()   # 前面出錯也要把已經抓到的資料存起來
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for p in data docs; do if [ -e "$p" ]; then git add "$p"; fi; done
          git diff --cached --quiet || git commit -m "scan $(date -u +%F)"
          git pull --rebase && git push
