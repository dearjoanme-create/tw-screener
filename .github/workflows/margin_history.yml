name: 補抓融資歷史（一次性）

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 補抓
        run: python tools/margin_history.py
      - name: 存檔
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/margin_hist.csv || true
          git diff --cached --quiet || git commit -m "融資歷史 $(date -u +%F)"
          git pull --rebase && git push
